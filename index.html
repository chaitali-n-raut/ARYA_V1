<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ARYA AI - Academic Readiness & Youth Analytics</title>
    <meta name="description" content="Unified academic intelligence and placement readiness platform connecting students, faculty mentors, T&P officers, recruiters, and university administration." />
    <meta property="og:title" content="ARYA AI - Academic Readiness & Youth Analytics" />
    <meta property="og:description" content="Unified academic intelligence and placement readiness platform connecting students, faculty mentors, T&P officers, recruiters, and university administration." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('arya_theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="font-sans antialiased text-[#263238] dark:text-[#F1F5F9] bg-[#F7FBFB] dark:bg-[#0B1215] transition-colors">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
